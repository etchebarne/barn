openapi: 3.0.3
info:
  title: barn API
  version: 0.1.0
  description: |
    HTTP API for barnd. Authenticated with a session cookie (`barn_session`).
    Mutating requests must send `X-Barn-CSRF: 1` (checked together with the Origin header).

    Realtime updates are delivered over a WebSocket at `GET /api/ws`; each frame is a JSON
    `WsEvent` (see components). The WebSocket is not described as an operation because
    OpenAPI can't express it; its payloads are.
servers:
  - url: /api

paths:
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      security: []
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }

  /auth/setup:
    post:
      operationId: setupAccount
      tags: [auth]
      security: []
      description: Create the single user account. Only allowed while no account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Account created and session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Logged out }

  /onboarding:
    get:
      operationId: getOnboarding
      tags: [onboarding]
      description: What's left to set up after the account exists.
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "401": { $ref: "#/components/responses/Error" }

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      description: |
        Create the starter agent with the chosen model. Requires the provider to be configured.
        Only allowed once (while no agents exist).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteOnboardingRequest" }
      responses:
        "200":
          description: Starter agent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompleteOnboardingResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /settings/provider:
    get:
      operationId: getProviderSettings
      tags: [settings]
      responses:
        "200":
          description: Model provider settings (the key itself is never returned)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSettings" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateProviderSettings
      tags: [settings]
      description: Validate the API key against the provider, then save it (encrypted at rest).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProviderSettingsRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSettings" }
        "400":
          description: The provider rejected the key, or the request is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /chats:
    get:
      operationId: listChats
      tags: [chats]
      responses:
        "200":
          description: All chats, most recently active first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Error" }

  /chats/{chatId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: listMessages
      tags: [chats]
      parameters:
        - name: before
          in: query
          required: false
          description: Return messages older than this message id
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Messages in chronological order (oldest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: sendMessage
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /chats/{chatId}/read:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: markChatRead
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkReadRequest" }
      responses:
        "204": { description: Marked as read }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      responses:
        "200":
          description: All agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Error" }

  /agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateAgent
      tags: [agents]
      description: Change an agent's settings. Broadcasts an agent.updated event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentRequest" }
      responses:
        "200":
          description: The updated agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgent
      tags: [agents]
      description: |
        Delete an agent for good: its DM and the messages in it, memories, tasks, conversation
        history, access to connections, and its sandbox when no other agent shares it. Its
        messages in group chats stay, without an author. The last admin agent can't be deleted.
        Broadcasts agent.deleted.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: It's the last admin agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{agentId}/memories:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listMemories
      tags: [agents]
      description: The durable memories an agent saved, oldest first.
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Memory" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/memories/{memoryId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
      - name: memoryId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteMemory
      tags: [agents]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/archive:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: archiveAgent
      tags: [agents]
      description: |
        Archive an agent: it stops working and disappears from the app (its DM is hidden). The
        last admin agent can't be archived. Broadcasts agent.archived.
      responses:
        "204": { description: Archived }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The agent can't be archived (e.g. it's the only admin agent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{agentId}/approvals:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listStandingApprovals
      tags: [agents]
      description: Actions the user always allows this agent to take without asking.
      responses:
        "200":
          description: The standing approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StandingApproval" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/approvals/{approvalId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
      - name: approvalId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeStandingApproval
      tags: [agents]
      description: Take a standing approval back, so the agent asks again.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sandbox:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSandbox
      tags: [agents]
      description: The agent's computer (Docker sandbox)
      responses:
        "200":
          description: Sandbox state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sandbox/restart:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: restartSandbox
      tags: [agents]
      description: Restart the agent's computer. Running processes stop; files in /home/agent stay.
      responses:
        "200":
          description: Sandbox state after the restart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/tasks:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listTasks
      tags: [agents]
      description: The agent's scheduled tasks, oldest first.
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      tags: [agents]
      description: Pause or resume a task.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTask
      tags: [agents]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /push/config:
    get:
      operationId: getPushConfig
      tags: [settings]
      description: The VAPID public key browsers subscribe with.
      responses:
        "200":
          description: Push config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushConfig" }
        "401": { $ref: "#/components/responses/Error" }

  /push/subscriptions:
    post:
      operationId: subscribePush
      tags: [settings]
      description: Register this browser for notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscription" }
      responses:
        "204": { description: Subscribed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unsubscribePush
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushUnsubscribe" }
      responses:
        "204": { description: Unsubscribed }
        "401": { $ref: "#/components/responses/Error" }

  /connectors/types:
    get:
      operationId: listConnectorTypes
      tags: [connectors]
      description: The kinds of apps that can be connected, with the fields each needs.
      responses:
        "200":
          description: Connector types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorType" }
        "401": { $ref: "#/components/responses/Error" }

  /connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      responses:
        "200":
          description: Connected accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connector" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createConnector
      tags: [connectors]
      description: Connect an account. Credentials are checked with the service before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnectorRequest" }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /connectors/catalog:
    get:
      operationId: listConnectorCatalog
      tags: [connectors]
      description: Apps that connect with a sign-in (their official MCP servers), ready to pick.
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogApp" }
        "401": { $ref: "#/components/responses/Error" }

  /connectors/sign-in:
    post:
      operationId: startSignIn
      tags: [connectors]
      description: |
        Start signing in to an MCP server that uses OAuth: for a new connection (url, name,
        agentIds), a connect card in chat (messageId) or reconnecting a connection
        (connectorId). Send the user to authorizeUrl. They come back to /oauth/callback, which
        finishes and redirects into the app. When pasteBack is true the server wouldn't accept
        barn's address: the user lands on an error page and pastes its address into
        /connectors/sign-in/complete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartSignInRequest" }
      responses:
        "200":
          description: Where to send the user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartSignInResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The connect card was already answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: barn couldn't reach the server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /connectors/sign-in/complete:
    post:
      operationId: completeSignIn
      tags: [connectors]
      description: Finish a paste-back sign-in with the address of the page the user landed on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteSignInRequest" }
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502":
          description: barn couldn't reach the server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /connectors/{connectorId}:
    parameters:
      - name: connectorId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateConnector
      tags: [connectors]
      description: |
        Rename, replace credentials (empty values keep the saved ones), change config, or set
        which agents may use the account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConnectorRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteConnector
      tags: [connectors]
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /settings/timezone:
    put:
      operationId: setTimezone
      tags: [settings]
      description: |
        Save the user's IANA time zone (the web app sends the browser's). Agents' schedules and
        "current time" use it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTimezoneRequest" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/retry:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryAgent
      tags: [agents]
      description: |
        Re-run the agent's last turn after a failure, from exactly where it stopped. The result
        arrives as usual over the WebSocket.
      responses:
        "202": { description: Retry queued }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The agent is busy and will pick up pending work on its own
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /messages/{messageId}/answer:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: answerPrompt
      tags: [chats]
      description: |
        Answer a pending prompt (a message with `prompt` set). The answer is stored on the
        message (broadcast as message.updated) and delivered to the agent that asked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptAnswer" }
      responses:
        "200":
          description: The updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The prompt was already answered or dismissed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /messages/{messageId}/connect:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: connectPrompt
      tags: [chats]
      description: |
        Accept a connection an agent proposed (a prompt of kind connect). barn checks the
        credentials with the app, saves the connection with the proposed agents' access, marks
        the prompt answered (broadcast as message.updated) and tells the agent. Credentials go
        straight to the connection and are never shown to the agent. To decline, answer the
        prompt with option 1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectPromptRequest" }
      responses:
        "200":
          description: The updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: The app rejected the details; the prompt stays pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The prompt was already answered or dismissed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: barn couldn't reach the app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /messages/{messageId}/reactions:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: toggleReaction
      tags: [chats]
      description: |
        Add the user's reaction with this emoji, or remove it if it's already there. Broadcasts
        message.updated; a new reaction on an agent's message is also delivered to that agent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToggleReactionRequest" }
      responses:
        "200":
          description: The updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /messages/{messageId}/dismiss:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: dismissPrompt
      tags: [chats]
      description: Dismiss a pending prompt without answering (broadcast as message.updated).
      responses:
        "200":
          description: The updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The prompt was already answered or dismissed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /models:
    get:
      operationId: listModels
      tags: [models]
      responses:
        "200":
          description: Models available from the provider
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: barn_session

  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code:
          type: string
          description: |
            Machine-readable reason where clients react to it: sign_in_required (an MCP server
            wants a sign-in instead of a key), reconnect (a sign-in expired)

    StandingApproval:
      type: object
      required: [id, label, createdAt]
      properties:
        id: { type: string }
        label:
          type: string
          description: 'What is allowed, e.g. "Slack message as you · Slack, when Channel is #alerts"'
        createdAt: { type: string, format: date-time }

    CatalogApp:
      type: object
      required: [id, name, description, url]
      properties:
        id: { type: string, description: 'e.g. "linear"' }
        name: { type: string }
        description: { type: string }
        url: { type: string, description: The app's MCP server }

    StartSignInRequest:
      type: object
      properties:
        url: { type: string, description: The MCP server (new connections) }
        name: { type: string }
        agentIds:
          type: array
          items: { type: string }
        messageId: { type: string, description: A connect card to answer }
        connectorId: { type: string, description: A connection to reconnect }

    StartSignInResponse:
      type: object
      required: [authorizeUrl, pasteBack]
      properties:
        authorizeUrl: { type: string }
        pasteBack:
          type: boolean
          description: The user will land on an error page whose address they paste back

    CompleteSignInRequest:
      type: object
      required: [callbackUrl]
      properties:
        callbackUrl: { type: string, description: The address of the page the user landed on }

    SignInResult:
      type: object
      required: [connector, chatId]
      properties:
        connector: { $ref: "#/components/schemas/Connector" }
        chatId:
          type: string
          nullable: true
          description: The chat whose connect card this answered

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256 }

    User:
      type: object
      required: [id, username]
      properties:
        id: { type: string }
        username: { type: string }

    AuthStatus:
      type: object
      required: [setupRequired, user]
      properties:
        setupRequired:
          type: boolean
          description: True when no account exists yet
        user:
          allOf: [{ $ref: "#/components/schemas/User" }]
          nullable: true
          description: The signed-in user, or null

    OnboardingState:
      type: object
      required: [providerConfigured, starterAgentCreated, completed]
      properties:
        providerConfigured:
          type: boolean
          description: An OpenCode Go API key has been saved
        starterAgentCreated: { type: boolean }
        completed:
          type: boolean
          description: Both steps are done; the app is ready to use

    CompleteOnboardingRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: Model id for the starter agent (from GET /models)
        agentName:
          type: string
          minLength: 1
          maxLength: 64
          description: Starter agent name; defaults to "barn"

    CompleteOnboardingResponse:
      type: object
      required: [agent, chatId]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        chatId:
          type: string
          description: The starter agent's DM

    ProviderSettings:
      type: object
      required: [provider, configured, keyHint]
      properties:
        provider: { type: string, enum: [opencode-go] }
        configured: { type: boolean }
        keyHint:
          type: string
          nullable: true
          description: Last 4 characters of the saved key, e.g. "…a1b2"

    UpdateProviderSettingsRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 512 }

    Agent:
      type: object
      required: [id, name, instructions, model, language, notifications, trustMode, isAdmin, activity, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        instructions:
          type: string
          description: What the agent is for and how it should work (its own system instructions)
        model: { type: string }
        language: { type: string, description: 'Reply language, or "auto"' }
        notifications: { type: boolean }
        trustMode: { type: string, enum: [ask, trusted] }
        isAdmin: { type: boolean }
        activity: { $ref: "#/components/schemas/AgentActivity" }
        createdAt: { type: string, format: date-time }

    Memory:
      type: object
      required: [id, text, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }

    Task:
      type: object
      required: [id, agentId, name, purpose, kind, cron, at, signal, enabled, nextFireAt, lastFiredAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        name: { type: string }
        purpose:
          type: string
          description: What the agent does when the task fires
        kind: { type: string, enum: [cron, once, signal] }
        cron:
          type: string
          nullable: true
          description: 5-field cron in the user's time zone (kind cron)
        at:
          type: string
          format: date-time
          nullable: true
          description: When a one-off task runs (kind once)
        enabled: { type: boolean }
        signal:
          type: string
          nullable: true
          description: 'kind signal: the event that runs it, e.g. "slack.app_mention in Slack — work where channel contains alerts"'
        nextFireAt:
          type: string
          format: date-time
          nullable: true
        lastFiredAt:
          type: string
          format: date-time
          nullable: true

    ConnectorField:
      type: object
      required: [key, label, secret, optional, events]
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        secret: { type: boolean }
        optional: { type: boolean }
        events:
          type: boolean
          description: |
            Only needed to receive events (e.g. a webhook signing secret). Filled in after
            connecting, next to the webhook URL, rather than in the first form.

    SetupStep:
      type: object
      required: [text, link, copy]
      properties:
        text: { type: string }
        link:
          type: object
          nullable: true
          description: A page to open for this step
          required: [label, url]
          properties:
            label: { type: string }
            url: { type: string }
        copy:
          type: object
          nullable: true
          description: Something to copy for this step (e.g. an app manifest)
          required: [label, text]
          properties:
            label: { type: string }
            text: { type: string }

    ConnectorSetup:
      type: object
      required: [steps, eventSteps]
      properties:
        steps:
          type: array
          description: How to get the credentials to connect
          items: { $ref: "#/components/schemas/SetupStep" }
        eventSteps:
          type: array
          description: How to start receiving events once connected (with the webhook URL)
          items: { $ref: "#/components/schemas/SetupStep" }

    ConnectorSignalType:
      type: object
      required: [type, description, fields]
      properties:
        type: { type: string }
        description: { type: string }
        fields:
          type: array
          items: { type: string }

    ConnectorType:
      type: object
      required: [type, name, description, credentialFields, configFields, signals, webhooks, setup]
      properties:
        type: { type: string, description: 'Machine name, e.g. "github"' }
        name: { type: string, description: 'Display name, e.g. "GitHub"' }
        description: { type: string }
        credentialFields:
          type: array
          items: { $ref: "#/components/schemas/ConnectorField" }
        configFields:
          type: array
          items: { $ref: "#/components/schemas/ConnectorField" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/ConnectorSignalType" }
        webhooks:
          type: boolean
          description: Receives events at a webhook URL (shown after connecting)
        setup: { $ref: "#/components/schemas/ConnectorSetup" }

    Connector:
      type: object
      required: [id, type, name, config, credentialsSet, agentIds, webhookUrl, webhookSecret, signIn, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        credentialsSet:
          type: array
          description: Credential keys that have a saved value (values are never returned)
          items: { type: string }
        agentIds:
          type: array
          description: Agents allowed to use this account
          items: { type: string }
        webhookUrl:
          type: string
          nullable: true
          description: Where the service should send events (types with webhooks)
        webhookSecret:
          type: string
          nullable: true
          description: |
            A secret barn generated for the service's webhook settings (e.g. GitHub's), shown so
            the user can copy it there
        signIn:
          type: string
          nullable: true
          enum: [ok, expired]
          description: Connected by signing in (MCP OAuth); expired means it needs Reconnect
        createdAt: { type: string, format: date-time }

    CreateConnectorRequest:
      type: object
      required: [type, name, credentials]
      properties:
        type: { type: string }
        name: { type: string, minLength: 1, maxLength: 64 }
        credentials:
          type: object
          additionalProperties: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        agentIds:
          type: array
          items: { type: string }

    UpdateConnectorRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        credentials:
          type: object
          additionalProperties: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        agentIds:
          type: array
          items: { type: string }

    UpdateTaskRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    PushConfig:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string }

    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 2000 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, maxLength: 200 }
            auth: { type: string, maxLength: 200 }

    PushUnsubscribe:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string }

    SetTimezoneRequest:
      type: object
      required: [timezone]
      properties:
        timezone: { type: string, description: 'IANA name, e.g. "America/Montevideo"' }

    Sandbox:
      type: object
      required: [status, sharedWith]
      properties:
        status:
          type: string
          enum: [unavailable, none, stopped, running]
          description: |
            unavailable: Docker isn't set up on the server; none: not created yet (created on
            first use)
        sharedWith:
          type: array
          description: Other agents using the same computer
          items: { type: string }

    UpdateAgentRequest:
      type: object
      properties:
        model:
          type: string
          description: Model id from GET /models
        name: { type: string, minLength: 1, maxLength: 64 }
        instructions: { type: string, minLength: 1, maxLength: 20000 }
        language:
          type: string
          maxLength: 40
          description: '"auto" (reply in the language people write in) or a language name'
        trustMode:
          type: string
          enum: [ask, trusted]
          description: trusted skips approvals for gated actions
        notifications:
          type: boolean
          description: Push this agent's messages to the user's devices

    AgentActivity:
      type: object
      required: [state, label]
      properties:
        state: { type: string, enum: [idle, working] }
        label:
          type: string
          nullable: true
          description: What the agent is doing, e.g. "thinking" or "running npm test"

    ChatMember:
      type: object
      required: [agentId, position]
      properties:
        agentId: { type: string }
        position: { type: integer }

    Chat:
      type: object
      required: [id, kind, name, members, unreadCount, lastMessage, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [dm, group] }
        name:
          type: string
          description: Group name, or the agent's name for DMs
        members:
          type: array
          description: Agent participants (the user is implicit in every chat)
          items: { $ref: "#/components/schemas/ChatMember" }
        unreadCount: { type: integer }
        lastMessage:
          allOf: [{ $ref: "#/components/schemas/Message" }]
          nullable: true
        createdAt: { type: string, format: date-time }

    MessageAuthor:
      type: object
      required: [kind, agentId]
      properties:
        kind: { type: string, enum: [user, agent, system] }
        agentId:
          type: string
          nullable: true
          description: The agent that wrote it; null on an agent message means the agent was deleted

    Message:
      type: object
      required: [id, chatId, author, body, createdAt, reactions, mentions]
      properties:
        id:
          type: string
          description: ULID; lexicographic order is chronological order
        chatId: { type: string }
        author: { $ref: "#/components/schemas/MessageAuthor" }
        body:
          type: string
          description: Markdown
        createdAt: { type: string, format: date-time }
        failure:
          allOf: [{ $ref: "#/components/schemas/MessageFailure" }]
          nullable: true
          description: Set on system messages reporting that an agent's turn failed
        mentions:
          type: array
          description: Agents @mentioned in the message (group chats)
          items: { type: string }
        reactions:
          type: array
          description: Emoji reactions, in the order each emoji was first used
          items: { $ref: "#/components/schemas/Reaction" }
        prompt:
          allOf: [{ $ref: "#/components/schemas/Prompt" }]
          nullable: true
          description: |
            Set on agent messages that ask the user something with clickable answers. `body`
            holds the question as plain text (for previews).
        event:
          allOf: [{ $ref: "#/components/schemas/MessageEvent" }]
          nullable: true
          description: Set on system messages that mark something that happened, e.g. an agent was created
        clientId:
          type: string
          description: |
            Echo of SendMessageRequest.clientId. Only present on the sendMessage response and the
            matching message.created event.

    MessageFailure:
      type: object
      required: [agentId, reason, retryable]
      properties:
        agentId: { type: string }
        reason:
          type: string
          enum: [no_key, invalid_key, model_blocked, provider_error, too_many_steps]
          description: |
            model_blocked: OpenCode refuses the agent's model (its provider trains on request
            data and the workspace's privacy settings forbid that). Offer to change the model.
        retryable: { type: boolean }

    ToggleReactionRequest:
      type: object
      required: [emoji]
      properties:
        emoji: { type: string, minLength: 1, maxLength: 32 }

    Reaction:
      type: object
      required: [emoji, by]
      properties:
        emoji: { type: string }
        by:
          type: array
          description: Who reacted with this emoji, oldest first
          items: { $ref: "#/components/schemas/MessageAuthor" }

    Prompt:
      type: object
      required: [kind, question, options, allowOther, status, answer]
      properties:
        kind:
          type: string
          enum: [single, multi, text, approval, connect]
          description: |
            single = pick one; multi = pick any number; text = free-text answer; approval = the
            agent wants to do something that needs the user's OK (options: Approve, Decline, and
            sometimes a third, "Always allow", which approves and stops asking for that action);
            connect = the agent proposes connecting an app (see connection; options: Connect,
            Decline; connect with POST /messages/{messageId}/connect)
        question: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/PromptOption" }
        allowOther:
          type: boolean
          description: Offer "type your own" in addition to the options
        status: { type: string, enum: [pending, answered, dismissed] }
        answer:
          allOf: [{ $ref: "#/components/schemas/PromptAnswer" }]
          nullable: true
        connection:
          allOf: [{ $ref: "#/components/schemas/PromptConnection" }]
          nullable: true
          description: The proposed connection (connect prompts only)
        preview:
          allOf: [{ $ref: "#/components/schemas/ActionPreview" }]
          nullable: true
          description: What an approval prompt would do, for the card (approval prompts only)

    ActionPreview:
      type: object
      required: [appType, appName, title, verb, note, fields, body]
      properties:
        appType:
          type: string
          nullable: true
          description: Connector type (see /connectors/types); null for barn's own actions
        appName: { type: string, nullable: true, description: The connection's name }
        title: { type: string, description: 'What the action is, e.g. "Slack message"' }
        verb: { type: string, description: 'Label for the approve button, e.g. "Send message"' }
        note: { type: string, nullable: true, description: A line about consequences }
        fields:
          type: array
          description: The action's arguments, in the order the agent gave them
          items: { $ref: "#/components/schemas/PreviewField" }
        body:
          allOf: [{ $ref: "#/components/schemas/PreviewField" }]
          nullable: true
          description: The main content (e.g. a message's text), shown large

    PreviewField:
      type: object
      required: [key, label, value]
      properties:
        key: { type: string }
        label: { type: string }
        value:
          description: Any JSON value (string, number, boolean, array or object)

    PromptConnection:
      type: object
      required: [type, name, config, agentIds, accountId, signIn]
      properties:
        type: { type: string, description: Connector type name (see /connectors/types) }
        name: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
          description: Non-secret settings the agent filled in (e.g. the server URL)
        agentIds:
          type: array
          items: { type: string }
          description: Agents that get access once it's connected
        signIn:
          type: boolean
          description: The server uses sign-in, so the card offers Sign in instead of key fields
        accountId:
          type: string
          nullable: true
          description: The connection, once the user connected it

    ConnectPromptRequest:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: object
          additionalProperties: { type: string }
          description: Values for the type's credential fields
        name:
          type: string
          description: Overrides the proposed name

    PromptOption:
      type: object
      required: [label]
      properties:
        label: { type: string }
        opensChatId:
          type: string
          description: Choosing this option also opens this chat (e.g. "Go talk to X")

    PromptAnswer:
      type: object
      properties:
        selected:
          type: array
          description: Indexes of the chosen options
          items: { type: integer, minimum: 0 }
        text:
          type: string
          maxLength: 4000
          description: Free-text answer (text prompts, or "type your own")

    MessageEvent:
      type: object
      required: [kind, agentId]
      properties:
        kind: { type: string, enum: [agent_created] }
        agentId:
          type: string
          description: The agent the event is about (e.g. the one that was created)
        chatId:
          type: string
          description: A chat to link to (e.g. the new agent's DM)

    MessagePage:
      type: object
      required: [messages, hasMore]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        hasMore: { type: boolean }

    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 32000 }
        clientId:
          type: string
          maxLength: 64
          description: Client-generated id, echoed back so the sender can reconcile its optimistic message

    MarkReadRequest:
      type: object
      required: [lastMessageId]
      properties:
        lastMessageId: { type: string }

    Model:
      type: object
      required: [id]
      properties:
        id: { type: string }

    # ---- WebSocket events (GET /api/ws) ----

    WsEvent:
      oneOf:
        - $ref: "#/components/schemas/WsMessageCreated"
        - $ref: "#/components/schemas/WsAgentActivity"
        - $ref: "#/components/schemas/WsChatRead"
        - $ref: "#/components/schemas/WsAgentUpdated"
        - $ref: "#/components/schemas/WsMessageUpdated"
        - $ref: "#/components/schemas/WsAgentCreated"
        - $ref: "#/components/schemas/WsChatCreated"
        - $ref: "#/components/schemas/WsAgentArchived"
        - $ref: "#/components/schemas/WsAgentDeleted"
      discriminator:
        propertyName: type
        mapping:
          message.created: "#/components/schemas/WsMessageCreated"
          agent.activity: "#/components/schemas/WsAgentActivity"
          chat.read: "#/components/schemas/WsChatRead"
          agent.updated: "#/components/schemas/WsAgentUpdated"
          message.updated: "#/components/schemas/WsMessageUpdated"
          agent.created: "#/components/schemas/WsAgentCreated"
          chat.created: "#/components/schemas/WsChatCreated"
          agent.archived: "#/components/schemas/WsAgentArchived"
          agent.deleted: "#/components/schemas/WsAgentDeleted"

    WsMessageCreated:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [message.created] }
        message: { $ref: "#/components/schemas/Message" }

    WsAgentActivity:
      type: object
      required: [type, agentId, activity]
      properties:
        type: { type: string, enum: [agent.activity] }
        agentId: { type: string }
        activity: { $ref: "#/components/schemas/AgentActivity" }

    WsChatRead:
      type: object
      required: [type, chatId, lastMessageId]
      description: The user read a chat (possibly from another device); clears its unread count
      properties:
        type: { type: string, enum: [chat.read] }
        chatId: { type: string }
        lastMessageId: { type: string }

    WsAgentUpdated:
      type: object
      required: [type, agent]
      description: An agent's settings changed
      properties:
        type: { type: string, enum: [agent.updated] }
        agent: { $ref: "#/components/schemas/Agent" }

    WsMessageUpdated:
      type: object
      required: [type, message]
      description: A message changed (its prompt was answered or dismissed, or it got a reaction)
      properties:
        type: { type: string, enum: [message.updated] }
        message: { $ref: "#/components/schemas/Message" }

    WsAgentCreated:
      type: object
      required: [type, agent]
      properties:
        type: { type: string, enum: [agent.created] }
        agent: { $ref: "#/components/schemas/Agent" }

    WsChatCreated:
      type: object
      required: [type, chat]
      properties:
        type: { type: string, enum: [chat.created] }
        chat: { $ref: "#/components/schemas/Chat" }

    WsAgentArchived:
      type: object
      required: [type, agentId]
      description: An agent was archived; drop it and its DM from the app
      properties:
        type: { type: string, enum: [agent.archived] }
        agentId: { type: string }

    WsAgentDeleted:
      type: object
      required: [type, agentId, chatId]
      description: |
        An agent was deleted: drop it and its DM (chatId) from the app. Its messages in group
        chats now have no author (show them as from a deleted agent).
      properties:
        type: { type: string, enum: [agent.deleted] }
        agentId: { type: string }
        chatId: { type: string, nullable: true }

security:
  - session: []
