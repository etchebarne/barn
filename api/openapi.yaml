openapi: 3.0.3
info:
  title: openbot API
  version: 0.1.0
  description: |
    HTTP API for openbotd. Authenticated with a session cookie (`openbot_session`).
    Mutating requests must send `X-Openbot-CSRF: 1` (checked together with the Origin header).

    Realtime updates are delivered over a WebSocket at `GET /api/ws`; each frame is a JSON
    `WsEvent` (see components). The WebSocket is not described as an operation because
    OpenAPI can't express it; its payloads are.
servers:
  - url: /api

paths:
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      security: []
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }

  /auth/setup:
    post:
      operationId: setupAccount
      tags: [auth]
      security: []
      description: Create the single user account. Only allowed while no account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Account created and session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Logged out }

  /onboarding:
    get:
      operationId: getOnboarding
      tags: [onboarding]
      description: What's left to set up after the account exists.
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "401": { $ref: "#/components/responses/Error" }

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      description: |
        Create the starter agent with the chosen model. Requires the provider to be configured.
        Only allowed once (while no agents exist).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteOnboardingRequest" }
      responses:
        "200":
          description: Starter agent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompleteOnboardingResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /settings/provider:
    get:
      operationId: getProviderSettings
      tags: [settings]
      responses:
        "200":
          description: Model provider settings (the key itself is never returned)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSettings" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateProviderSettings
      tags: [settings]
      description: Validate the API key against the provider, then save it (encrypted at rest).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProviderSettingsRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSettings" }
        "400":
          description: The provider rejected the key, or the request is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /chats:
    get:
      operationId: listChats
      tags: [chats]
      responses:
        "200":
          description: All chats, most recently active first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Error" }

  /sidebar/categories:
    get:
      operationId: listSidebarCategories
      tags: [chats]
      description: The user's sidebar categories, in order. Only the user arranges the sidebar.
      responses:
        "200":
          description: Categories in order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SidebarCategory" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSidebarCategory
      tags: [chats]
      description: Add a category at the end. Broadcasts sidebar.updated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSidebarCategoryRequest" }
      responses:
        "201":
          description: The new category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SidebarCategory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /sidebar/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateSidebarCategory
      tags: [chats]
      description: Rename or collapse/expand a category. Broadcasts sidebar.updated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSidebarCategoryRequest" }
      responses:
        "200":
          description: The category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SidebarCategory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSidebarCategory
      tags: [chats]
      description: Delete a category; its chats move to Unassigned. Broadcasts sidebar.updated.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sidebar/layout:
    put:
      operationId: setSidebarLayout
      tags: [chats]
      description: |
        Arrange the sidebar after a drag: the order of categories, and for each listed section
        (a category, or null for Unassigned) its chats in order. Chats not listed keep their
        place. Broadcasts sidebar.updated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SidebarLayout" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /chats/{chatId}/attachments:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: uploadAttachment
      tags: [chats]
      description: |
        Upload a file to attach to a message in this chat (then pass its id in
        SendMessageRequest.attachmentIds). Up to 25 MB. Uploads that are never sent are removed
        after a day.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The uploaded file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413":
          description: The file is over 25 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema: { type: string }
      - name: download
        in: query
        required: false
        description: Send as a download even if the browser could show it
        schema: { type: boolean }
    get:
      operationId: getAttachment
      tags: [chats]
      description: |
        The file's contents. Images (PNG, JPEG, GIF, WebP) and PDFs are shown in the browser;
        everything else downloads.
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /chats/{chatId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: listMessages
      tags: [chats]
      parameters:
        - name: before
          in: query
          required: false
          description: Return messages older than this message id
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Messages in chronological order (oldest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: sendMessage
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /chats/{chatId}/history:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    delete:
      operationId: clearChatHistory
      tags: [chats]
      description: |
        Clears a DM: deletes its messages (and their attachments and reactions), and the agent
        forgets that conversation (it keeps its saved memories, settings, tasks and what happened
        in groups). Group chats can't be cleared.
      responses:
        "204": { description: Cleared }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /chats/{chatId}/read:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: markChatRead
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkReadRequest" }
      responses:
        "204": { description: Marked as read }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      responses:
        "200":
          description: All agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Error" }

  /agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateAgent
      tags: [agents]
      description: Change an agent's settings. Broadcasts an agent.updated event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentRequest" }
      responses:
        "200":
          description: The updated agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgent
      tags: [agents]
      description: |
        Delete an agent for good: its DM and the messages in it, memories, tasks, conversation
        history, access to connections, and its sandbox when no other agent shares it. Its
        messages in group chats stay, without an author. The last admin agent can't be deleted.
        Broadcasts agent.deleted.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: It's the last admin agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{agentId}/memories:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listMemories
      tags: [agents]
      description: The durable memories an agent saved, oldest first.
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Memory" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMemory
      tags: [agents]
      description: Add a memory for the agent, as if it had saved it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryRequest" }
      responses:
        "201":
          description: The new memory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/memories/{memoryId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
      - name: memoryId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateMemory
      tags: [agents]
      description: Rewrite a memory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryRequest" }
      responses:
        "200":
          description: The updated memory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMemory
      tags: [agents]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/approvals:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listStandingApprovals
      tags: [agents]
      description: Actions the user always allows this agent to take without asking.
      responses:
        "200":
          description: The standing approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StandingApproval" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/approvals/{approvalId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
      - name: approvalId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeStandingApproval
      tags: [agents]
      description: Take a standing approval back, so the agent asks again.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sandbox:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSandbox
      tags: [agents]
      description: The agent's computer (Docker sandbox)
      responses:
        "200":
          description: Sandbox state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sandbox/restart:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: restartSandbox
      tags: [agents]
      description: Restart the agent's computer. Running processes stop; files in /home/agent stay.
      responses:
        "200":
          description: Sandbox state after the restart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sandbox/files:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listSandboxFiles
      tags: [computer]
      description: |
        A folder in the agent's computer (starting it if needed). Up to 5000 items; `truncated`
        says when there were more.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Absolute path in the computer, e.g. /home/agent/notes.md
      responses:
        "200":
          description: The folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderListing" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      operationId: writeSandboxFile
      tags: [computer]
      description: Write a file (upload or save), creating its folder; replaces what's there. Up to 200 MB.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Absolute path in the computer, e.g. /home/agent/notes.md
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Written }
        "413": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSandboxFile
      tags: [computer]
      description: Delete a file, or a folder with everything in it.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Absolute path in the computer, e.g. /home/agent/notes.md
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sandbox/files/download:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadSandboxFile
      tags: [computer]
      description: |
        A file's bytes (up to 200 MB). Images and PDFs are served inline when `inline` is true;
        everything else as a download.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Absolute path in the computer, e.g. /home/agent/notes.md
        - name: inline
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "413": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sandbox/folders:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: createSandboxFolder
      tags: [computer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathRequest" }
      responses:
        "204": { description: Created }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sandbox/move:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: moveSandboxFile
      tags: [computer]
      description: Rename or move a file or folder. Fails with 409 if the destination exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "204": { description: Moved }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sandbox/terminal:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: sandboxTerminal
      tags: [computer]
      description: |
        WebSocket: an interactive shell in the agent's computer (bash, in /home/agent). Query
        `cols` and `rows` set the starting size. Binary messages carry terminal bytes both ways;
        the client sends text messages `{"type":"resize","cols":120,"rows":40}` to resize. The
        server closes with status 1000 when the shell exits, and the shell ends when the
        connection closes.
      parameters:
        - name: cols
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: rows
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "101": { description: Switching to WebSocket }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/tasks:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listTasks
      tags: [agents]
      description: The agent's scheduled tasks, oldest first.
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTask
      tags: [agents]
      description: Schedule a task for the agent, as if it had made it. Give cron or at.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: The new task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      tags: [agents]
      description: |
        Change a task: pause or resume it, rename it, change what it does or its schedule (cron
        or at; a signal task keeps its trigger). Only the fields given change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTask
      tags: [agents]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /tasks/{taskId}/runs:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listTaskRuns
      tags: [agents]
      description: The task's latest runs (up to 100), newest first.
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskRun" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /tasks/{taskId}/run:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: runTaskNow
      tags: [agents]
      description: |
        Run the task now, outside its schedule (a test run). A task with a check runs its check and
        wakes the agent whatever the output. Signal tasks can't: they need an event.
      responses:
        "202": { description: Started }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /schedule:
    get:
      operationId: getSchedule
      tags: [agents]
      description: |
        Every agent's tasks, when the enabled ones run in the coming days, and the latest runs
        (unchanged checks left out).
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 31, default: 7 }
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Error" }

  /search:
    get:
      operationId: search
      tags: [chats]
      description: |
        Search messages in every chat (full text: every word must appear, as a prefix of a word),
        agents' memories, and tasks. Best message matches first.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      description: |
        The skill library (/shared/skills), by name. Folders that aren't usable skills are listed
        with the problem.
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
        "401": { $ref: "#/components/responses/Error" }

  /skills/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSkill
      tags: [skills]
      description: A skill with its instructions and files.
      responses:
        "200":
          description: The skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: saveSkill
      tags: [skills]
      description: Create or rewrite a skill's SKILL.md (other files in its folder stay).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSkillRequest" }
      responses:
        "200":
          description: The saved skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSkill
      tags: [skills]
      description: Delete a skill's folder and everything in it.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /backup/agents:
    get:
      operationId: exportAgents
      tags: [settings]
      description: |
        Every agent's configuration as one file: settings, instructions and personality, memories,
        tasks, the connections it may use (by name) and its standing approvals. No secrets,
        messages, files or skills.
      responses:
        "200":
          description: The backup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentsBackup" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: restoreAgents
      tags: [settings]
      description: |
        Restore agents from a backup. Agents whose name is already taken are skipped, so nothing
        is overwritten. Connections are matched by name; tasks and approvals that need a
        connection this server doesn't have, and one-off tasks already past, are left out (the
        result says which).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentsBackup" }
      responses:
        "200":
          description: What was restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /push/config:
    get:
      operationId: getPushConfig
      tags: [settings]
      description: The VAPID public key browsers subscribe with.
      responses:
        "200":
          description: Push config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushConfig" }
        "401": { $ref: "#/components/responses/Error" }

  /push/subscriptions:
    post:
      operationId: subscribePush
      tags: [settings]
      description: Register this browser for notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscription" }
      responses:
        "204": { description: Subscribed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unsubscribePush
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushUnsubscribe" }
      responses:
        "204": { description: Unsubscribed }
        "401": { $ref: "#/components/responses/Error" }

  /connectors/types:
    get:
      operationId: listConnectorTypes
      tags: [connectors]
      description: The kinds of apps that can be connected, with the fields each needs.
      responses:
        "200":
          description: Connector types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorType" }
        "401": { $ref: "#/components/responses/Error" }

  /connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      responses:
        "200":
          description: Connected accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connector" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createConnector
      tags: [connectors]
      description: Connect an account. Credentials are checked with the service before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnectorRequest" }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /connectors/catalog:
    get:
      operationId: listConnectorCatalog
      tags: [connectors]
      description: Apps that connect with a sign-in (their official MCP servers), ready to pick.
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogApp" }
        "401": { $ref: "#/components/responses/Error" }

  /connectors/sign-in:
    post:
      operationId: startSignIn
      tags: [connectors]
      description: |
        Start signing in to an MCP server that uses OAuth: for a new connection (url, name,
        agentIds), a connect card in chat (messageId) or reconnecting a connection
        (connectorId). Send the user to authorizeUrl. They come back to /oauth/callback, which
        finishes and redirects into the app. When pasteBack is true the server wouldn't accept
        openbot's address: the user lands on an error page and pastes its address into
        /connectors/sign-in/complete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartSignInRequest" }
      responses:
        "200":
          description: Where to send the user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartSignInResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The connect card was already answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: openbot couldn't reach the server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /connectors/sign-in/complete:
    post:
      operationId: completeSignIn
      tags: [connectors]
      description: Finish a paste-back sign-in with the address of the page the user landed on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteSignInRequest" }
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502":
          description: openbot couldn't reach the server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /connectors/{connectorId}:
    parameters:
      - name: connectorId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateConnector
      tags: [connectors]
      description: |
        Rename, replace credentials (empty values keep the saved ones), change config, or set
        which agents may use the account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConnectorRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteConnector
      tags: [connectors]
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /settings/timezone:
    put:
      operationId: setTimezone
      tags: [settings]
      description: |
        Save the user's IANA time zone (the web app sends the browser's). Agents' schedules and
        "current time" use it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTimezoneRequest" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/retry:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryAgent
      tags: [agents]
      description: |
        Re-run the agent's last turn after a failure, from exactly where it stopped. The result
        arrives as usual over the WebSocket.
      responses:
        "202": { description: Retry queued }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The agent is busy and will pick up pending work on its own
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{agentId}/stop:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: stopAgent
      tags: [agents]
      description: |
        Stop what the agent is doing right now (its turn or task run, with the model call,
        helpers and commands in its computer). A "stopped" notice is posted in its DM. Messages and
        tasks queued after it still run.
      responses:
        "202": { description: Stopping }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The agent isn't working
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /messages/{messageId}/secret:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: provideSecret
      tags: [chats]
      description: |
        Provide the secret a pending secret prompt asks for. It's stored encrypted for the agent
        (replacing one with the same name), the prompt is marked answered (option 0), and the
        agent is told it's available. The value never appears in messages.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValue" }
      responses:
        "200":
          description: The updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/usage:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAgentUsage
      tags: [agents]
      description: Tokens the agent used (as providers reported them), and how full its context is.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
          description: How many days back, including today, in the user's time zone
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /usage:
    get:
      operationId: getUsage
      tags: [settings]
      description: Tokens all agents used, per day and per agent.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
          description: How many days back, including today, in the user's time zone
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "401": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/secrets:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAgentSecrets
      tags: [agents]
      description: The agent's secrets, by name (never their values)
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentSecret" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/secrets/{name}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
      - name: name
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setAgentSecret
      tags: [agents]
      description: Add a secret for the agent, or replace its value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetSecretRequest" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgentSecret
      tags: [agents]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /messages/{messageId}/answer:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: answerPrompt
      tags: [chats]
      description: |
        Answer a pending prompt (a message with `prompt` set). The answer is stored on the
        message (broadcast as message.updated) and delivered to the agent that asked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptAnswer" }
      responses:
        "200":
          description: The updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The prompt was already answered or dismissed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /messages/{messageId}/connect:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: connectPrompt
      tags: [chats]
      description: |
        Accept a connection an agent proposed (a prompt of kind connect). openbot checks the
        credentials with the app, saves the connection with the proposed agents' access, marks
        the prompt answered (broadcast as message.updated) and tells the agent. Credentials go
        straight to the connection and are never shown to the agent. To decline, answer the
        prompt with option 1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectPromptRequest" }
      responses:
        "200":
          description: The updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: The app rejected the details; the prompt stays pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The prompt was already answered or dismissed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: openbot couldn't reach the app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /messages/{messageId}/reactions:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: toggleReaction
      tags: [chats]
      description: |
        Add the user's reaction with this emoji, or remove it if it's already there. Broadcasts
        message.updated; a new reaction on an agent's message is also delivered to that agent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToggleReactionRequest" }
      responses:
        "200":
          description: The updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /messages/{messageId}/dismiss:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: dismissPrompt
      tags: [chats]
      description: Dismiss a pending prompt without answering (broadcast as message.updated).
      responses:
        "200":
          description: The updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The prompt was already answered or dismissed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /models:
    get:
      operationId: listModels
      tags: [models]
      responses:
        "200":
          description: Models available from the provider
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: openbot_session

  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code:
          type: string
          description: |
            Machine-readable reason where clients react to it: sign_in_required (an MCP server
            wants a sign-in instead of a key), reconnect (a sign-in expired)

    StandingApproval:
      type: object
      required: [id, label, createdAt]
      properties:
        id: { type: string }
        label:
          type: string
          description: 'What is allowed, e.g. "Slack message as you · Slack, when Channel is #alerts"'
        createdAt: { type: string, format: date-time }

    CatalogApp:
      type: object
      required: [id, name, description, url]
      properties:
        id: { type: string, description: 'e.g. "linear"' }
        name: { type: string }
        description: { type: string }
        url: { type: string, description: The app's MCP server }

    StartSignInRequest:
      type: object
      properties:
        url: { type: string, description: The MCP server (new connections) }
        name: { type: string }
        agentIds:
          type: array
          items: { type: string }
        messageId: { type: string, description: A connect card to answer }
        connectorId: { type: string, description: A connection to reconnect }

    StartSignInResponse:
      type: object
      required: [authorizeUrl, pasteBack]
      properties:
        authorizeUrl: { type: string }
        pasteBack:
          type: boolean
          description: The user will land on an error page whose address they paste back

    CompleteSignInRequest:
      type: object
      required: [callbackUrl]
      properties:
        callbackUrl: { type: string, description: The address of the page the user landed on }

    SignInResult:
      type: object
      required: [connector, chatId]
      properties:
        connector: { $ref: "#/components/schemas/Connector" }
        chatId:
          type: string
          nullable: true
          description: The chat whose connect card this answered

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256 }

    User:
      type: object
      required: [id, username]
      properties:
        id: { type: string }
        username: { type: string }

    AuthStatus:
      type: object
      required: [setupRequired, user]
      properties:
        setupRequired:
          type: boolean
          description: True when no account exists yet
        user:
          allOf: [{ $ref: "#/components/schemas/User" }]
          nullable: true
          description: The signed-in user, or null

    OnboardingState:
      type: object
      required: [providerConfigured, starterAgentCreated, completed]
      properties:
        providerConfigured:
          type: boolean
          description: An OpenCode Go API key has been saved
        starterAgentCreated: { type: boolean }
        completed:
          type: boolean
          description: Both steps are done; the app is ready to use

    CompleteOnboardingRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: Model id for the starter agent (from GET /models)
        agentName:
          type: string
          minLength: 1
          maxLength: 64
          description: Starter agent name; defaults to "openbot"

    CompleteOnboardingResponse:
      type: object
      required: [agent, chatId]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        chatId:
          type: string
          description: The starter agent's DM

    ProviderSettings:
      type: object
      required: [provider, configured, keyHint]
      properties:
        provider: { type: string, enum: [opencode-go] }
        configured: { type: boolean }
        keyHint:
          type: string
          nullable: true
          description: Last 4 characters of the saved key, e.g. "…a1b2"

    UpdateProviderSettingsRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 512 }

    Agent:
      type: object
      required: [id, name, instructions, personality, model, language, notifications, trustMode, isAdmin, activity, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        instructions:
          type: string
          description: What the agent is for and how it should work (its own system instructions)
        personality:
          type: string
          description: How the agent comes across (tone, voice, manner); empty for the default
        model: { type: string }
        language: { type: string, description: 'Reply language, or "auto"' }
        notifications: { type: boolean }
        trustMode: { type: string, enum: [ask, trusted] }
        isAdmin: { type: boolean }
        activity: { $ref: "#/components/schemas/AgentActivity" }
        createdAt: { type: string, format: date-time }

    Memory:
      type: object
      required: [id, text, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }

    Task:
      type: object
      required: [id, agentId, name, purpose, kind, cron, at, signal, enabled, nextFireAt, lastFiredAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        name: { type: string }
        purpose:
          type: string
          description: What the agent does when the task fires
        kind: { type: string, enum: [cron, once, signal] }
        cron:
          type: string
          nullable: true
          description: 5-field cron in the user's time zone (kind cron)
        at:
          type: string
          format: date-time
          nullable: true
          description: When a one-off task runs (kind once)
        enabled: { type: boolean }
        signal:
          type: string
          nullable: true
          description: 'kind signal: the event that runs it, e.g. "slack.app_mention in Slack — work where channel contains alerts"'
        check:
          type: string
          nullable: true
          description: |
            A shell command run on the schedule in the agent's computer; the agent is woken only when
            its output changes (cron and once tasks)
        nextFireAt:
          type: string
          format: date-time
          nullable: true
        lastFiredAt:
          type: string
          format: date-time
          nullable: true

    TaskRun:
      type: object
      required: [id, taskId, agentId, trigger, outcome, detail, startedAt, finishedAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        agentId: { type: string }
        trigger:
          type: string
          enum: [schedule, signal, manual]
          description: "What started it: the schedule, an app event, or the user (Run now)"
        outcome:
          type: string
          enum: [running, quiet, acted, unchanged, failed, stopped]
          description: |
            quiet: ran and found nothing worth doing; acted: did something others can see (detail
            lists it); unchanged: the check's output hadn't changed, so the agent wasn't woken;
            failed: detail says why; stopped: the user stopped it.
        detail: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }

    UpcomingRuns:
      type: object
      required: [taskId, times, more]
      properties:
        taskId: { type: string }
        times:
          type: array
          items: { type: string, format: date-time }
          description: The next runs in the window, earliest first (at most 50)
        more:
          type: integer
          description: Runs in the window beyond those listed

    Schedule:
      type: object
      required: [tasks, upcoming, recent]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        upcoming:
          type: array
          items: { $ref: "#/components/schemas/UpcomingRuns" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/TaskRun" }

    SearchResults:
      type: object
      required: [messages, memories, tasks]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/MessageHit" }
        memories:
          type: array
          items: { $ref: "#/components/schemas/MemoryHit" }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }

    MessageHit:
      type: object
      required: [id, chatId, author, createdAt, snippet]
      properties:
        id: { type: string }
        chatId: { type: string }
        author: { $ref: "#/components/schemas/MessageAuthor" }
        createdAt: { type: string, format: date-time }
        snippet:
          type: string
          description: |
            Plain text around the match; matched words sit between U+0002 and U+0003 (control
            characters, never in a message), and cut text is marked with "…".

    MemoryHit:
      type: object
      required: [id, agentId, text]
      properties:
        id: { type: string }
        agentId: { type: string }
        text: { type: string }

    Skill:
      type: object
      required: [name, description, path, updatedAt]
      properties:
        name: { type: string }
        description: { type: string }
        path:
          type: string
          description: Its folder as agents see it, e.g. /shared/skills/weekly-report
        instructions:
          type: string
          description: SKILL.md after the frontmatter (getSkill only)
        files:
          type: array
          items: { type: string }
          description: Other files in its folder, relative to it (getSkill only)
        updatedAt: { type: string, format: date-time }
        problem:
          type: string
          description: Why the folder isn't a usable skill, if it isn't

    SaveSkillRequest:
      type: object
      required: [description, instructions]
      properties:
        description: { type: string, minLength: 1, maxLength: 1024 }
        instructions: { type: string, minLength: 1 }

    AgentsBackup:
      type: object
      required: [format, version, exportedAt, agents]
      properties:
        format: { type: string, enum: [openbot-agents] }
        version: { type: integer, description: "1" }
        exportedAt: { type: string, format: date-time }
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentBackup" }

    AgentBackup:
      type: object
      required: [name, instructions, personality, model, language, notifications, trustMode, admin, memories, tasks, connections, approvals]
      properties:
        name: { type: string }
        instructions: { type: string }
        personality: { type: string }
        model: { type: string }
        language: { type: string }
        notifications: { type: boolean }
        trustMode: { type: string, enum: [ask, trusted] }
        admin: { type: boolean }
        memories:
          type: array
          items: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskBackup" }
        connections:
          type: array
          items: { $ref: "#/components/schemas/ConnectionRef" }
        approvals:
          type: array
          items: { $ref: "#/components/schemas/ApprovalBackup" }

    TaskBackup:
      type: object
      required: [name, purpose, kind, enabled]
      properties:
        name: { type: string }
        purpose: { type: string }
        kind: { type: string, enum: [cron, once, signal] }
        cron: { type: string }
        at: { type: string, format: date-time }
        check: { type: string }
        enabled: { type: boolean }
        signal: { $ref: "#/components/schemas/TaskBackupSignal" }

    TaskBackupSignal:
      type: object
      required: [account, type, match]
      properties:
        account: { type: string, description: The connection's name }
        type: { type: string }
        match:
          type: object
          additionalProperties: { type: string }

    ConnectionRef:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }

    ApprovalBackup:
      type: object
      required: [action, label, match]
      properties:
        action:
          type: string
          description: "tool:<name>, or connector:<tool> with the connection in account"
        account: { type: string, description: The connection's name, for connector actions }
        label: { type: string }
        match:
          type: object
          additionalProperties: { type: string }

    RestoreResult:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/RestoredAgent" }

    RestoredAgent:
      type: object
      required: [name, restored, notes]
      properties:
        name: { type: string }
        agentId: { type: string }
        restored: { type: boolean }
        notes:
          type: array
          items: { type: string }
          description: What was left out, and why

    ConnectorField:
      type: object
      required: [key, label, secret, optional, events]
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        secret: { type: boolean }
        optional: { type: boolean }
        events:
          type: boolean
          description: |
            Only needed to receive events (e.g. a webhook signing secret). Filled in after
            connecting, next to the webhook URL, rather than in the first form.

    SetupStep:
      type: object
      required: [text, link, copy]
      properties:
        text: { type: string }
        link:
          type: object
          nullable: true
          description: A page to open for this step
          required: [label, url]
          properties:
            label: { type: string }
            url: { type: string }
        copy:
          type: object
          nullable: true
          description: Something to copy for this step (e.g. an app manifest)
          required: [label, text]
          properties:
            label: { type: string }
            text: { type: string }

    ConnectorSetup:
      type: object
      required: [steps, eventSteps]
      properties:
        steps:
          type: array
          description: How to get the credentials to connect
          items: { $ref: "#/components/schemas/SetupStep" }
        eventSteps:
          type: array
          description: How to start receiving events once connected (with the webhook URL)
          items: { $ref: "#/components/schemas/SetupStep" }

    ConnectorSignalType:
      type: object
      required: [type, description, fields]
      properties:
        type: { type: string }
        description: { type: string }
        fields:
          type: array
          items: { type: string }

    ConnectorType:
      type: object
      required: [type, name, description, credentialFields, configFields, signals, webhooks, setup]
      properties:
        type: { type: string, description: 'Machine name, e.g. "github"' }
        name: { type: string, description: 'Display name, e.g. "GitHub"' }
        description: { type: string }
        credentialFields:
          type: array
          items: { $ref: "#/components/schemas/ConnectorField" }
        configFields:
          type: array
          items: { $ref: "#/components/schemas/ConnectorField" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/ConnectorSignalType" }
        webhooks:
          type: boolean
          description: Receives events at a webhook URL (shown after connecting)
        setup: { $ref: "#/components/schemas/ConnectorSetup" }

    Connector:
      type: object
      required: [id, type, name, config, credentialsSet, agentIds, webhookUrl, webhookSecret, signIn, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        credentialsSet:
          type: array
          description: Credential keys that have a saved value (values are never returned)
          items: { type: string }
        agentIds:
          type: array
          description: Agents allowed to use this account
          items: { type: string }
        webhookUrl:
          type: string
          nullable: true
          description: Where the service should send events (types with webhooks)
        webhookSecret:
          type: string
          nullable: true
          description: |
            A secret openbot generated for the service's webhook settings (e.g. GitHub's), shown so
            the user can copy it there
        signIn:
          type: string
          nullable: true
          enum: [ok, expired]
          description: Connected by signing in (MCP OAuth); expired means it needs Reconnect
        createdAt: { type: string, format: date-time }

    CreateConnectorRequest:
      type: object
      required: [type, name, credentials]
      properties:
        type: { type: string }
        name: { type: string, minLength: 1, maxLength: 64 }
        credentials:
          type: object
          additionalProperties: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        agentIds:
          type: array
          items: { type: string }

    UpdateConnectorRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        credentials:
          type: object
          additionalProperties: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        agentIds:
          type: array
          items: { type: string }

    UpdateTaskRequest:
      type: object
      properties:
        enabled: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 80 }
        purpose: { type: string, minLength: 1, maxLength: 4000 }
        cron:
          type: string
          description: Repeat on this 5-field cron schedule, in the user's time zone
        at:
          type: string
          description: Run once at this local date-time ("2026-10-09 15:30") or RFC 3339 time
        check:
          type: string
          maxLength: 2000
          description: Wake the agent only when this command's output changes (empty removes it)

    CreateTaskRequest:
      type: object
      required: [name, purpose]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        purpose:
          type: string
          minLength: 1
          maxLength: 4000
          description: What the agent does when it runs
        cron:
          type: string
          description: Repeat on this 5-field cron schedule, in the user's time zone
        at:
          type: string
          description: Run once at this local date-time ("2026-10-09 15:30") or RFC 3339 time
        check:
          type: string
          maxLength: 2000
          description: Wake the agent only when this command's output changes (empty removes it)

    MemoryRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }

    PushConfig:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string }

    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 2000 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, maxLength: 200 }
            auth: { type: string, maxLength: 200 }

    PushUnsubscribe:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string }

    SetTimezoneRequest:
      type: object
      required: [timezone]
      properties:
        timezone: { type: string, description: 'IANA name, e.g. "America/Montevideo"' }

    FolderListing:
      type: object
      required: [path, entries, truncated]
      properties:
        path: { type: string, description: The folder's clean absolute path }
        entries:
          type: array
          description: Folders first, then files, by name
          items: { $ref: "#/components/schemas/FileEntry" }
        truncated: { type: boolean }

    FileEntry:
      type: object
      required: [name, kind, size, modifiedAt]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [file, dir, link, dirlink, other]
          description: link and dirlink are symlinks to a file or a folder
        size: { type: integer, format: int64 }
        modifiedAt: { type: string, format: date-time }

    PathRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }

    MoveRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }

    Sandbox:
      type: object
      required: [status, sharedWith]
      properties:
        status:
          type: string
          enum: [unavailable, none, stopped, running]
          description: |
            unavailable: Docker isn't set up on the server; none: not created yet (created on
            first use)
        sharedWith:
          type: array
          description: Other agents using the same computer
          items: { type: string }

    UpdateAgentRequest:
      type: object
      properties:
        model:
          type: string
          description: Model id from GET /models
        name: { type: string, minLength: 1, maxLength: 64 }
        instructions: { type: string, minLength: 1, maxLength: 20000 }
        personality:
          type: string
          maxLength: 2000
          description: Empty clears it
        language:
          type: string
          maxLength: 40
          description: '"auto" (reply in the language people write in) or a language name'
        trustMode:
          type: string
          enum: [ask, trusted]
          description: trusted skips approvals for gated actions
        notifications:
          type: boolean
          description: Push this agent's messages to the user's devices

    AgentActivity:
      type: object
      required: [state, label]
      properties:
        state: { type: string, enum: [idle, working] }
        label:
          type: string
          nullable: true
          description: What the agent is doing, e.g. "thinking" or "running npm test"

    ChatMember:
      type: object
      required: [agentId, position]
      properties:
        agentId: { type: string }
        position: { type: integer }

    Chat:
      type: object
      required: [id, kind, name, members, unreadCount, lastMessage, createdAt, categoryId, position]
      properties:
        id: { type: string }
        kind: { type: string, enum: [dm, group] }
        name:
          type: string
          description: Group name, or the agent's name for DMs
        members:
          type: array
          description: Agent participants (the user is implicit in every chat)
          items: { $ref: "#/components/schemas/ChatMember" }
        unreadCount: { type: integer }
        lastMessage:
          allOf: [{ $ref: "#/components/schemas/Message" }]
          nullable: true
        createdAt: { type: string, format: date-time }
        categoryId:
          type: string
          nullable: true
          description: The sidebar category it's in; null = Unassigned
        position:
          type: integer
          nullable: true
          description: |
            Its place within its section once the user arranged it. Within a section, chats
            with no position (new or never moved) come first, most recently active first, then
            the rest by position.

    SidebarCategory:
      type: object
      required: [id, name, collapsed]
      properties:
        id: { type: string }
        name: { type: string }
        collapsed: { type: boolean }

    CreateSidebarCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }

    UpdateSidebarCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        collapsed: { type: boolean }

    SidebarLayout:
      type: object
      required: [categoryOrder, sections]
      properties:
        categoryOrder:
          type: array
          description: Every category id, in the new order
          items: { type: string }
        sections:
          type: array
          description: Sections whose chats changed, each with all its chats in order
          items:
            type: object
            required: [categoryId, chatIds]
            properties:
              categoryId:
                type: string
                nullable: true
                description: null for Unassigned
              chatIds:
                type: array
                items: { type: string }

    MessageAuthor:
      type: object
      required: [kind, agentId]
      properties:
        kind: { type: string, enum: [user, agent, system] }
        agentId:
          type: string
          nullable: true
          description: The agent that wrote it; null on an agent message means the agent was deleted

    Message:
      type: object
      required: [id, chatId, author, body, createdAt, reactions, mentions, attachments]
      properties:
        id:
          type: string
          description: ULID; lexicographic order is chronological order
        chatId: { type: string }
        author: { $ref: "#/components/schemas/MessageAuthor" }
        body:
          type: string
          description: Markdown
        createdAt: { type: string, format: date-time }
        failure:
          allOf: [{ $ref: "#/components/schemas/MessageFailure" }]
          nullable: true
          description: Set on system messages reporting that an agent's turn failed
        mentions:
          type: array
          description: Agents @mentioned in the message (group chats)
          items: { type: string }
        attachments:
          type: array
          description: Files and images attached to the message, in order
          items: { $ref: "#/components/schemas/Attachment" }
        reactions:
          type: array
          description: Emoji reactions, in the order each emoji was first used
          items: { $ref: "#/components/schemas/Reaction" }
        prompt:
          allOf: [{ $ref: "#/components/schemas/Prompt" }]
          nullable: true
          description: |
            Set on agent messages that ask the user something with clickable answers. `body`
            holds the question as plain text (for previews).
        event:
          allOf: [{ $ref: "#/components/schemas/MessageEvent" }]
          nullable: true
          description: Set on system messages that mark something that happened, e.g. an agent was created
        replyTo:
          allOf: [{ $ref: "#/components/schemas/QuotedMessage" }]
          nullable: true
          description: The earlier message in this chat that this one replies to
        clientId:
          type: string
          description: |
            Echo of SendMessageRequest.clientId. Only present on the sendMessage response and the
            matching message.created event.

    QuotedMessage:
      type: object
      required: [id, available]
      description: A message being replied to, as shown above the reply
      properties:
        id: { type: string }
        available:
          type: boolean
          description: False when the message no longer exists; the other fields are then absent
        author: { $ref: "#/components/schemas/MessageAuthor" }
        body:
          type: string
          description: The start of its text (at most 300 characters), Markdown
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    MessageFailure:
      type: object
      required: [agentId, reason, retryable]
      properties:
        agentId: { type: string }
        reason:
          type: string
          enum: [no_key, invalid_key, model_blocked, provider_error, too_many_steps, stopped]
          description: |
            model_blocked: OpenCode refuses the agent's model (its provider trains on request
            data and the workspace's privacy settings forbid that). Offer to change the model.
            stopped: the user stopped the agent (a neutral notice, not an error).
        retryable: { type: boolean }

    ToggleReactionRequest:
      type: object
      required: [emoji]
      properties:
        emoji: { type: string, minLength: 1, maxLength: 32 }

    Reaction:
      type: object
      required: [emoji, by]
      properties:
        emoji: { type: string }
        by:
          type: array
          description: Who reacted with this emoji, oldest first
          items: { $ref: "#/components/schemas/MessageAuthor" }

    Prompt:
      type: object
      required: [kind, question, options, allowOther, status, answer]
      properties:
        kind:
          type: string
          enum: [single, multi, text, approval, connect, secret]
          description: |
            single = pick one; multi = pick any number; text = free-text answer; approval = the
            agent wants to do something that needs the user's OK (options: Approve, Decline, and
            sometimes a third, "Always allow", which approves and stops asking for that action);
            connect = the agent proposes connecting an app (see connection; options: Connect,
            Decline; connect with POST /messages/{messageId}/connect); secret = the agent asks for
            a secret (see secret; options: Save, Not now; provide it with
            POST /messages/{messageId}/secret, decline by answering option 1). Once provided, the
            answer selects option 0; the value is never part of the message.
        question: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/PromptOption" }
        allowOther:
          type: boolean
          description: Offer "type your own" in addition to the options
        status: { type: string, enum: [pending, answered, dismissed] }
        answer:
          allOf: [{ $ref: "#/components/schemas/PromptAnswer" }]
          nullable: true
        connection:
          allOf: [{ $ref: "#/components/schemas/PromptConnection" }]
          nullable: true
          description: The proposed connection (connect prompts only)
        preview:
          allOf: [{ $ref: "#/components/schemas/ActionPreview" }]
          nullable: true
          description: What an approval prompt would do, for the card (approval prompts only)
        secret:
          allOf: [{ $ref: "#/components/schemas/SecretRequest" }]
          nullable: true
          description: The secret asked for (secret prompts only)

    UsageTotals:
      type: object
      required: [calls, promptTokens, cachedTokens, cacheWriteTokens, completionTokens, reasoningTokens]
      properties:
        calls: { type: integer }
        promptTokens: { type: integer, description: All input, including cached }
        cachedTokens: { type: integer, description: Input read from the provider's cache (cheaper) }
        cacheWriteTokens: { type: integer }
        completionTokens: { type: integer }
        reasoningTokens: { type: integer, description: Part of completionTokens }

    DayUsage:
      allOf:
        - $ref: "#/components/schemas/UsageTotals"
        - type: object
          required: [date]
          properties:
            date: { type: string, format: date }

    PurposeUsage:
      allOf:
        - $ref: "#/components/schemas/UsageTotals"
        - type: object
          required: [purpose]
          properties:
            purpose:
              type: string
              description: turn (conversation), task (scheduled/app-event runs), compaction, subagent

    AgentUsage:
      allOf:
        - $ref: "#/components/schemas/UsageTotals"
        - type: object
          required: [agentId]
          properties:
            agentId: { type: string }

    UsageReport:
      type: object
      required: [today, total, days, byPurpose, byAgent]
      properties:
        today: { $ref: "#/components/schemas/UsageTotals" }
        total: { $ref: "#/components/schemas/UsageTotals" }
        days:
          type: array
          description: Oldest first, one per day (empty days included)
          items: { $ref: "#/components/schemas/DayUsage" }
        byPurpose:
          type: array
          items: { $ref: "#/components/schemas/PurposeUsage" }
        byAgent:
          type: array
          description: Per agent, most used first (all-agents report; one entry for an agent's report)
          items: { $ref: "#/components/schemas/AgentUsage" }
        context:
          type: object
          nullable: true
          description: The agent's context right now (agent reports only)
          required: [tokens, window, compactAt]
          properties:
            tokens: { type: integer, description: Input size of its latest request }
            window: { type: integer, description: Its model's context window }
            compactAt: { type: integer, description: When older context gets summarized }

    SecretRequest:
      type: object
      required: [name, description]
      properties:
        name: { type: string, description: 'Environment variable name, e.g. "GITHUB_TOKEN"' }
        description: { type: string, description: What it is and where to get it }

    AgentSecret:
      type: object
      required: [name, description, createdAt, updatedAt]
      description: A secret an agent has (never its value)
      properties:
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SecretValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 65536
          description: The secret (surrounding whitespace is trimmed)

    SetSecretRequest:
      type: object
      required: [value]
      properties:
        value: { type: string, minLength: 1, maxLength: 65536 }
        description: { type: string, maxLength: 300, description: Kept when omitted or empty }

    ActionPreview:
      type: object
      required: [appType, appName, title, verb, note, fields, body]
      properties:
        appType:
          type: string
          nullable: true
          description: Connector type (see /connectors/types); null for openbot's own actions
        appName: { type: string, nullable: true, description: The connection's name }
        title: { type: string, description: 'What the action is, e.g. "Slack message"' }
        verb: { type: string, description: 'Label for the approve button, e.g. "Send message"' }
        note: { type: string, nullable: true, description: A line about consequences }
        fields:
          type: array
          description: The action's arguments, in the order the agent gave them
          items: { $ref: "#/components/schemas/PreviewField" }
        body:
          allOf: [{ $ref: "#/components/schemas/PreviewField" }]
          nullable: true
          description: The main content (e.g. a message's text), shown large

    PreviewField:
      type: object
      required: [key, label, value]
      properties:
        key: { type: string }
        label: { type: string }
        value:
          description: Any JSON value (string, number, boolean, array or object)

    PromptConnection:
      type: object
      required: [type, name, config, agentIds, accountId, signIn]
      properties:
        type: { type: string, description: Connector type name (see /connectors/types) }
        name: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
          description: Non-secret settings the agent filled in (e.g. the server URL)
        agentIds:
          type: array
          items: { type: string }
          description: Agents that get access once it's connected
        signIn:
          type: boolean
          description: The server uses sign-in, so the card offers Sign in instead of key fields
        accountId:
          type: string
          nullable: true
          description: The connection, once the user connected it

    ConnectPromptRequest:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: object
          additionalProperties: { type: string }
          description: Values for the type's credential fields
        name:
          type: string
          description: Overrides the proposed name

    PromptOption:
      type: object
      required: [label]
      properties:
        label: { type: string }
        opensChatId:
          type: string
          description: Choosing this option also opens this chat (e.g. "Go talk to X")

    PromptAnswer:
      type: object
      properties:
        selected:
          type: array
          description: Indexes of the chosen options
          items: { type: integer, minimum: 0 }
        text:
          type: string
          maxLength: 4000
          description: Free-text answer (text prompts, or "type your own")

    MessageEvent:
      type: object
      required: [kind, agentId]
      properties:
        kind: { type: string, enum: [agent_created] }
        agentId:
          type: string
          description: The agent the event is about (e.g. the one that was created)
        chatId:
          type: string
          description: A chat to link to (e.g. the new agent's DM)

    MessagePage:
      type: object
      required: [messages, hasMore]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        hasMore: { type: boolean }

    Attachment:
      type: object
      required: [id, name, mime, size, url, width, height]
      properties:
        id: { type: string }
        name: { type: string, description: The file name }
        mime: { type: string, description: 'e.g. "image/png", "application/pdf"' }
        size: { type: integer, format: int64, description: Bytes }
        url: { type: string, description: Where to fetch it (same origin, needs the session) }
        width: { type: integer, nullable: true, description: Pixels, for images }
        height: { type: integer, nullable: true, description: Pixels, for images }

    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 32000
          description: The text; may be empty when the message has attachments
        attachmentIds:
          type: array
          maxItems: 10
          description: Uploaded attachments (from uploadAttachment in this chat) to send with it
          items: { type: string }
        replyToId:
          type: string
          description: An earlier message in this chat to reply to
        clientId:
          type: string
          maxLength: 64
          description: Client-generated id, echoed back so the sender can reconcile its optimistic message

    MarkReadRequest:
      type: object
      required: [lastMessageId]
      properties:
        lastMessageId: { type: string }

    Model:
      type: object
      required: [id]
      properties:
        id: { type: string }

    # ---- WebSocket events (GET /api/ws) ----

    WsEvent:
      oneOf:
        - $ref: "#/components/schemas/WsMessageCreated"
        - $ref: "#/components/schemas/WsAgentActivity"
        - $ref: "#/components/schemas/WsChatRead"
        - $ref: "#/components/schemas/WsAgentUpdated"
        - $ref: "#/components/schemas/WsMessageUpdated"
        - $ref: "#/components/schemas/WsAgentCreated"
        - $ref: "#/components/schemas/WsChatCreated"
        - $ref: "#/components/schemas/WsAgentDeleted"
        - $ref: "#/components/schemas/WsSidebarUpdated"
        - $ref: "#/components/schemas/WsChatCleared"
        - $ref: "#/components/schemas/WsTaskRun"
      discriminator:
        propertyName: type
        mapping:
          message.created: "#/components/schemas/WsMessageCreated"
          agent.activity: "#/components/schemas/WsAgentActivity"
          chat.read: "#/components/schemas/WsChatRead"
          agent.updated: "#/components/schemas/WsAgentUpdated"
          message.updated: "#/components/schemas/WsMessageUpdated"
          agent.created: "#/components/schemas/WsAgentCreated"
          chat.created: "#/components/schemas/WsChatCreated"
          agent.deleted: "#/components/schemas/WsAgentDeleted"
          sidebar.updated: "#/components/schemas/WsSidebarUpdated"
          chat.cleared: "#/components/schemas/WsChatCleared"
          task.run: "#/components/schemas/WsTaskRun"

    WsTaskRun:
      type: object
      required: [type, run]
      description: A task run started or finished
      properties:
        type: { type: string, enum: [task.run] }
        run: { $ref: "#/components/schemas/TaskRun" }

    WsMessageCreated:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [message.created] }
        message: { $ref: "#/components/schemas/Message" }

    WsAgentActivity:
      type: object
      required: [type, agentId, activity]
      properties:
        type: { type: string, enum: [agent.activity] }
        agentId: { type: string }
        activity: { $ref: "#/components/schemas/AgentActivity" }

    WsChatRead:
      type: object
      required: [type, chatId, lastMessageId]
      description: The user read a chat (possibly from another device); clears its unread count
      properties:
        type: { type: string, enum: [chat.read] }
        chatId: { type: string }
        lastMessageId: { type: string }

    WsAgentUpdated:
      type: object
      required: [type, agent]
      description: An agent's settings changed
      properties:
        type: { type: string, enum: [agent.updated] }
        agent: { $ref: "#/components/schemas/Agent" }

    WsMessageUpdated:
      type: object
      required: [type, message]
      description: A message changed (its prompt was answered or dismissed, or it got a reaction)
      properties:
        type: { type: string, enum: [message.updated] }
        message: { $ref: "#/components/schemas/Message" }

    WsAgentCreated:
      type: object
      required: [type, agent]
      properties:
        type: { type: string, enum: [agent.created] }
        agent: { $ref: "#/components/schemas/Agent" }

    WsChatCreated:
      type: object
      required: [type, chat]
      properties:
        type: { type: string, enum: [chat.created] }
        chat: { $ref: "#/components/schemas/Chat" }

    WsChatCleared:
      type: object
      required: [type, chatId]
      description: A chat's history was cleared; drop its messages (newer ones arrive as message.created)
      properties:
        type: { type: string, enum: [chat.cleared] }
        chatId: { type: string }

    WsSidebarUpdated:
      type: object
      required: [type]
      description: The sidebar's categories or order changed (e.g. on another device); refetch
      properties:
        type: { type: string, enum: [sidebar.updated] }

    WsAgentDeleted:
      type: object
      required: [type, agentId, chatId]
      description: |
        An agent was deleted: drop it and its DM (chatId) from the app. Its messages in group
        chats now have no author (show them as from a deleted agent).
      properties:
        type: { type: string, enum: [agent.deleted] }
        agentId: { type: string }
        chatId: { type: string, nullable: true }

security:
  - session: []
