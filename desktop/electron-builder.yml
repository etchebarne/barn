appId: net.etchebarne.openbot
productName: openbot
copyright: Copyright © Martin Etchebarne
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.test.js"
  - assets/**/*
  - package.json
artifactName: openbot-${version}-${os}-${arch}.${ext}
linux:
  target: [AppImage, deb, rpm]
  # Every standard size: the hicolor theme has no 1024x1024 folder, so a single big icon is
  # never found by desktops.
  icon: build/icons
  category: Network
  maintainer: Martin Etchebarne <martin@etchebarne.net>
  synopsis: Your persistent AI agents, on the desktop
  description: openbot for the desktop. Connects to your own openbot server.
  executableName: openbot
  syncDesktopName: true
deb:
  depends: [libnotify4, libxtst6, libnss3]
rpm:
  # No /usr/lib/.build-id links: other Electron apps (Slack, VS Code…) ship identical helper
  # binaries, and their links would conflict on install.
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
win:
  target: [nsis]
nsis:
  oneClick: true
  perMachine: false
  shortcutName: openbot
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  identity: null
publish: null
